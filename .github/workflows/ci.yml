name: Nexora CI

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "api/**"
      - "frontend/**"
      - "worker/**"
      - "celery-publisher/**"
      - "ansible/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy.yml"

  push:
    branches:
      - develop
    paths:
      - "api/**"
      - "frontend/**"
      - "worker/**"
      - "celery-publisher/**"
      - "ansible/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

  ENVIRONMENT: ${{ vars.ENVIRONMENT }}

  BACKEND_ECR_REPOSITORY: ${{ vars.BACKEND_ECR_REPOSITORY }}
  FRONTEND_ECR_REPOSITORY: ${{ vars.FRONTEND_ECR_REPOSITORY }}
  WORKER_ECR_REPOSITORY: ${{ vars.WORKER_ECR_REPOSITORY }}
  PUBLISHER_ECR_REPOSITORY: ${{ vars.PUBLISHER_ECR_REPOSITORY }}

  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com

  POSTGRES_USER: ${{ vars.POSTGRES_USER }}
  POSTGRES_DB: ${{ vars.POSTGRES_DB }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

  REDIS_HOST: ${{ vars.REDIS_HOST }}
  REDIS_PORT: ${{ vars.REDIS_PORT }}

  DB_HOST: ${{ vars.DB_HOST }}
  DB_PORT: ${{ vars.DB_PORT }}
  DB_USER: ${{ vars.DB_USER }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  DB_NAME: ${{ vars.DB_NAME }}

  FRONTEND_PORT: ${{ vars.FRONTEND_PORT }}
  API_PORT: ${{ vars.API_PORT }}

jobs:

  validate:
    name: Validate Application
    runs-on: ${{ vars.GHA_RUNNER }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            api/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Install Backend Dependencies
        working-directory: ./api
        run: npm ci

      - name: Lint Backend
        working-directory: ./api
        run: npm run lint

      - name: Test Backend
        working-directory: ./api
        run: npm test

      - name: Build Backend
        working-directory: ./api
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Worker Dependencies
        working-directory: ./worker
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Test Worker
        working-directory: ./worker
        run: pytest

      - name: Install Ansible
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ansible-core

      - name: Validate Ansible Playbook
        working-directory: ./ansible
        run: |
          ansible-playbook playbooks/configure.yml --syntax-check

  build-and-push:
    name: Build & Push Images
    needs: validate

    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      github.event_name == 'workflow_dispatch'

    runs-on: ${{ vars.GHA_RUNNER }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Generate Image Metadata
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE_TAG="${ENVIRONMENT}-${SHORT_SHA}"

          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"

          echo "API_IMAGE=${ECR_REGISTRY}/${BACKEND_ECR_REPOSITORY}:${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=${ECR_REGISTRY}/${FRONTEND_ECR_REPOSITORY}:${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "WORKER_IMAGE=${ECR_REGISTRY}/${WORKER_ECR_REPOSITORY}:${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "PUBLISHER_IMAGE=${ECR_REGISTRY}/${PUBLISHER_ECR_REPOSITORY}:${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=nexora-api
          cache-to: type=gha,mode=max,scope=nexora-api
          tags: |
            ${{ env.API_IMAGE }}
            ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_ECR_REPOSITORY }}:${{ env.ENVIRONMENT }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=nexora-frontend
          cache-to: type=gha,mode=max,scope=nexora-frontend
          tags: |
            ${{ env.FRONTEND_IMAGE }}
            ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_ECR_REPOSITORY }}:${{ env.ENVIRONMENT }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}

      - name: Build and Push Worker
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          file: ./worker/Dockerfile
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=nexora-worker
          cache-to: type=gha,mode=max,scope=nexora-worker
          tags: |
            ${{ env.WORKER_IMAGE }}
            ${{ env.ECR_REGISTRY }}/${{ env.WORKER_ECR_REPOSITORY }}:${{ env.ENVIRONMENT }}

      - name: Build and Push Celery Publisher
        uses: docker/build-push-action@v6
        with:
          context: ./celery-publisher
          file: ./celery-publisher/Dockerfile
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=celery-publisher
          cache-to: type=gha,mode=max,scope=celery-publisher
          tags: |
            ${{ env.PUBLISHER_IMAGE }}
            ${{ env.ECR_REGISTRY }}/${{ env.PUBLISHER_ECR_REPOSITORY }}:${{ env.ENVIRONMENT }}

      - name: Build Summary
        run: |
          echo "## Container Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: ${ENVIRONMENT}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image Tag: ${IMAGE_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "- API Image: ${API_IMAGE}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend Image: ${FRONTEND_IMAGE}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker Image: ${WORKER_IMAGE}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Publisher Image: ${PUBLISHER_IMAGE}" >> "$GITHUB_STEP_SUMMARY"