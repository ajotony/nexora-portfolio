all:
  vars:
    ansible_user: "{{ ec2_user }}"
    ansible_ssh_private_key_file: "{{ ssh_key }}"
    ansible_ssh_common_args: '-o ProxyCommand="aws ssm start-session --target %h --document-name AWS-StartSSHSession --parameters portNumber=%p"'
  children:
    manager:
      hosts:
        swarm-manager:
          ansible_host: "{{ manager_instance_id }}"

    workers:
      hosts:
        swarm-worker-1:
          ansible_host: "{{ worker_1_instance_id }}"
        swarm-worker-2:
          ansible_host: "{{ worker_2_instance_id }}"

    uat:
      children:
        manager:
        workers: