- name: Deploy monitoring stack
  ansible.builtin.command:
    cmd: >
      docker stack deploy
      --with-registry-auth
      --detach=true
      -c {{ monitoring_root }}/monitoring-stack.yml
      monitoring

- name: Wait for monitoring services
  ansible.builtin.command:
    cmd: docker stack services monitoring --format '{% raw %}{{.Name}} {{.Replicas}}{% endraw %}'
  register: monitoring_status
  changed_when: false
  retries: 30
  delay: 5
  until:
    - monitoring_status.rc == 0
    - monitoring_status.stdout is search("monitoring_prometheus 1/1")
    - monitoring_status.stdout is search("monitoring_alertmanager 1/1")
    - monitoring_status.stdout is search("monitoring_grafana 1/1")
    - monitoring_status.stdout is search("monitoring_node-exporter 3/3")
    - monitoring_status.stdout is search("monitoring_cadvisor 3/3")
    - monitoring_status.stdout is search("monitoring_loki 1/1")
    - monitoring_status.stdout is search("monitoring_alloy 3/3")
    - monitoring_status.stdout is search("monitoring_postgres-exporter 1/1")