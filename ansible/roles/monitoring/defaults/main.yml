monitoring_root: /opt/nexora-monitoring

prometheus_image: prom/prometheus:v3.13.4
grafana_image: grafana/grafana:13.2.3
cadvisor_image: ghcr.io/google/cadvisor:0.57.0
node_exporter_image: prom/node-exporter:v1.10.2
alertmanager_image: prom/alertmanager:v0.29.0
loki_image: grafana/loki:3.7.8
